name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # config.py's Setup section claims "Python 3.10+" -- 3.11 and 3.13
        # (oldest and newest realistic choices) actually exercise that claim
        # rather than just testing whatever one version happens to be handy.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest tests/ -v

  lockfile:
    name: Verify requirements-lock.txt installs cleanly
    # macOS, deliberately, not ubuntu-latest: requirements-lock.txt is a
    # flat `pip freeze` from a real macOS dev machine, which bakes in
    # macOS-only transitive packages (pyobjc-*, from seleniumbase's GUI-
    # automation stack) with no platform markers -- pip freeze doesn't
    # preserve those. Installing that flat list on Linux would fail
    # outright (pyobjc isn't published for Linux at all). This isn't
    # actually a workaround: this project's real deployment target IS
    # macOS (FBref scraping needs a real browser via seleniumbase, and the
    # README's setup instructions are already macOS-specific), so
    # verifying the lockfile on the platform it represents is the more
    # correct choice, not a lesser one.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the Python version requirements-lock.txt was generated
      # with (see its header comment) -- this job validates the lockfile
      # itself, not general version compatibility (that's the matrix job
      # above, against pyproject.toml's loose pins).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # XGBoost needs the OpenMP runtime on macOS and GitHub's macOS
      # runners don't ship it by default -- see README "Setup" for the
      # same requirement on a local dev machine (found the hard way: it
      # fails at import time, not install time, so this job caught it
      # missing here before it was even documented for local setup).
      - name: Install libomp (XGBoost dependency on macOS)
        run: brew install libomp

      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Test (pytest)
        run: python -m pytest tests/ -v

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bundesliga-coach-impact"
version = "1.0.0"
description = "Does sacking the coach work? Bundesliga coach-change effects, formation matchups, and match forecasts benchmarked against the betting market."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Felix Nitschke" }]
# scikit-learn 1.9 and pandas 3 both need 3.11+; CI tests 3.11 and 3.13.
requires-python = ">=3.11"
dependencies = [
    "soccerdata>=1.9,<2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    # 1.9: LogisticRegressionCV's use_legacy_attributes (src/market_benchmark.py)
    "scikit-learn>=1.9",
    "xgboost>=2.0",
    "joblib>=1.3",
    "optuna>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
bundesliga = "cli:main"

[project.urls]
Repository = "https://github.com/FPN1997/bundesliga-coach-impact"

[tool.setuptools]
packages = ["src"]
py-modules = ["cli", "config", "predict"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "logs", "data", "outputs", "site"]
# The codebase's actual convention (long, prose-heavy explanatory comments)
# runs wider than Black's 88-char default.
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = [
    # (function-uses-loop-variable) flags src/build_dataset.py's
    # find_coach() closure over team_coaches -- checked by hand: the closure
    # is defined AND fully consumed (via .apply(find_coach)) within the same
    # groupby loop iteration, before team_coaches is rebound on the next
    # one, so there's no actual late-binding bug here.
    "B023",
    # En/em dashes are used deliberately in a few display strings (a
    # season-range label, chart titles), not typos introduced by a bad paste.
    "RUF001",
]

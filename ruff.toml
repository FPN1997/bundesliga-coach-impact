# Lint config for CI (.github/workflows/ci.yml) and local use (`ruff check .`).
target-version = "py311"
extend-exclude = [".venv", "logs", "data", "outputs"]
# The codebase's actual convention (long, prose-heavy explanatory comments)
# runs wider than Black's 88-char default.
line-length = 110

[lint]
select = ["E", "F", "I", "B", "RUF"]

ignore = [
    # (function-uses-loop-variable) flags src/build_dataset.py's
    # find_coach() closure over team_coaches -- checked by hand: the closure
    # is defined AND fully consumed (via .apply(find_coach)) within the same
    # groupby loop iteration, before team_coaches is rebound on the next
    # one, so there's no actual late-binding bug here. Common false positive
    # for the "define a helper closing over a per-iteration value, use it
    # immediately" pattern that's otherwise idiomatic pandas. Suppressed
    # project-wide rather than per-line since it's a confirmed false
    # positive, not a rule being routed around.
    "B023",
    # En dashes ("–") are used deliberately in a couple of places (a
    # date-format character set to match, a season-range display string),
    # not typos introduced by a bad paste.
    "RUF001",
]
